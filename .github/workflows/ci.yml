name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-web:
    name: Verify web (Next.js) and core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies (also builds @ncue/core)
        run: npm ci
      - name: Typecheck @ncue/core
        run: npm run lint -w @ncue/core
      - name: Placeholder Firebase key (throwaway, generated per run)
        # firebase-admin's cert() parses the key at import time; nothing connects to Firebase during the build.
        run: |
          { echo "FIREBASE_PRIVATE_KEY<<EOF_KEY"; openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null; echo "EOF_KEY"; } >> "$GITHUB_ENV"
      - name: Build web
        env:
          # Placeholders: modules check these at import time; nothing is contacted during the build.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          FIREBASE_PROJECT_ID: ci-placeholder
          FIREBASE_CLIENT_EMAIL: ci@ci-placeholder.iam.gserviceaccount.com
        run: npm run build

  verify-mobile:
    name: Verify mobile (Expo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Expo and NativeWind type references
        # Same files `expo start` writes locally (gitignored), so `className` and Expo types resolve.
        working-directory: apps/mobile
        run: |
          printf '/// <reference types="expo/types" />\n' > expo-env.d.ts
          printf '/// <reference types="nativewind/types" />\n' > nativewind-env.d.ts
      - name: Typecheck
        run: npm run typecheck -w @ncue/mobile

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (changed commits)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then RANGE="$BASE..$GITHUB_SHA"; else RANGE="-1"; fi
          ./gitleaks git --redact --no-banner --log-opts="$RANGE" .

  notify:
    name: Notify failure
    if: failure() && github.event_name == 'push'
    needs: [verify-web, verify-mobile, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MSG: ${{ github.event.head_commit.message }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$WEBHOOK" ] || { echo "DISCORD_WEBHOOK_URL not set; skipping"; exit 0; }
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg sha "${GITHUB_SHA::7}" --arg msg "$(printf '%s' "$MSG" | head -n1 | cut -c1-200)" \
                --arg actor "$GITHUB_ACTOR" --arg url "$URL" \
            '{username: "mac-server-watchdog", allowed_mentions: {parse: []}, embeds: [{
               title: ("CI FAILED · " + $repo), url: $url, color: 15844367,
               description: ("**CI failed** on main.\n`" + $sha + "` " + $msg),
               fields: [{name: "Author", value: $actor, inline: true}, {name: "Logs", value: ("[Open run](" + $url + ")"), inline: true}],
               footer: {text: "GitHub Actions · CI gate"}, timestamp: (now | todate)}]}' \
          | curl -fsS -H 'Content-Type: application/json' -d @- "$WEBHOOK"
